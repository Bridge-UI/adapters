name: Bridge UI Adapters Release

on:
  push:
    tags:
      - "v*"

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Installs dependencies, builds, tests and packs. Has no publish rights: a
  # compromised dependency running here cannot mint an npm OIDC token.
  build:
    runs-on: ubuntu-latest
    name: Build and pack
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid tag: $TAG"
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NPM_TAG=latest
          elif [[ "$VERSION" =~ -beta(\.|$) ]]; then
            NPM_TAG=beta
          elif [[ "$VERSION" =~ -rc(\.|$) ]]; then
            NPM_TAG=rc
          elif [[ "$VERSION" =~ -alpha(\.|$) ]]; then
            NPM_TAG=alpha
          else
            NPM_TAG=next
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (npm dist-tag: $NPM_TAG)"

      # No dependency cache on the release path: a poisoned cache would ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        env:
          VERSION: ${{ steps.release.outputs.value }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version is ${PKG_VERSION}, expected ${VERSION}"
            exit 1
          fi

      - run: npm run check:parity
      - run: npm run build
      - run: npm run test:run

      - name: Pack package
        run: |
          mkdir -p packed
          npm pack --pack-destination packed
          ls -l packed

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packed/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Only publishes the tarballs built above. No checkout, no install, no
  # third-party code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish @bridge-ui/adapters to npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packed

      - name: Publish package
        env:
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
        run: npm publish packed/bridge-ui-adapters-*.tgz --tag "$NPM_TAG" --access public --provenance --ignore-scripts
